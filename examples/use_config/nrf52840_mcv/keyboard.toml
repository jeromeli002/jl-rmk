[keyboard]
# Replace with your keyboard identity.
name = "morc Keyboard"
product_name = "Macro Keyboard"
vendor_id = 0xF001
product_id = 0x3001
manufacturer = "jlkb"
chip = "nrf52840"

[matrix]
# Matrix pins are required.
row_pins = ["P0_06", "P0_08", "P0_17", "P0_20"]
col_pins = ["P0_22", "P0_24", "P1_00", "P0_11"]
# Default diode direction is col2row; set `row2col = true` if needed.
# row2col = true

[layout]
rows = 4
cols = 4
map = """
(0,0) (0,1) (0,2) (0,3)
(1,0) (1,1) (1,2) (1,3)
(2,0) (2,1) (2,2) (2,3)
(3,0) (3,1) (3,2) (3,3)
"""

[keymap]
layers = 8

[[keymap.layer]]
name = "base_layer"
keys = """
NumLock KpSlash KpAsterisk KpMinus
Kp7     Kp8     Kp9        KpPlus
Kp4     Kp5     Kp6        Kp6
Kp1     Kp2     Kp3        Enter
"""

[[keymap.layer]]
name = "second_layer"
keys = """
NumLock KpSlash KpAsterisk KpMinus
Kp7     Kp8     Kp9        KpPlus
Kp4     Kp5     Kp6        Kp6
Kp1     Kp2     Kp3        Enter
"""

[aliases]
my_copy = "WM(C, LCtrl)"
my_paste = "WM(V, LCtrl)"

[light]
# All light pins are high-active by default, uncomment if you want it to be low-active
# capslock.pin = "P0_30"
# capslock.low_active = false
# scrolllock.pin = "PA3"
# scrolllock.low_active = true
# Just ignore if no light pin is used for it
# numslock.pin = "PA5"
# numslock.low_active = true

# Encoder 0
[[input_device.encoder]]
pin_a = "P0_29"
pin_b = "P0_02"
internal_pullup = true
phase = "resolution"
resolution = 2
reverse = false

# Encoder 1
[[input_device.encoder]]
pin_a = "P1_04"
pin_b = "P1_06"
phase = "resolution"
internal_pullup = true
resolution = 2
reverse = false

# Encoder 2
[[input_device.encoder]]
pin_a = "P1_15"
pin_b = "P1_13"
phase = "resolution"
internal_pullup = true
resolution = 2
reverse = false

# Encoder 3
[[input_device.encoder]]
pin_a = "P0_10"
pin_b = "P1_11"
phase = "resolution"
internal_pullup = true
resolution = 2
reverse = false

[storage]
# Storage is enabled by default.
# enabled = false
# clear_storage = true

[ble]
enabled = true
# vddh has an internal voltage divider
battery_adc_pin = "vddh"
# Or
# battery_adc_pin = "P0_04"
# adc_divider_measured = 2000
# adc_divider_total = 2806

[behavior.combo]
timeout = "150ms"
combos = [
  # Press J and K keys simultaneously to output "L"
  { actions = [
    "J",
    "K",
  ], output = "L" },
  # Press F and D keys simultaneously to switch to layer 2, but only valid on layer 0
  { actions = [
    "F",
    "D",
  ], output = "TO(1)", layer = 0 },
  # Three-key combo, press A, S, and D keys to output "X"
  { actions = [
    "A",
    "S",
    "D",
  ], output = "X" },
]

[rmk]
combo_max_num = 128
fork_max_num = 32

# IGNORE/DONT-INCLUDE THIS SECTION Unless you're using custom nRF52840 based board (Eg not a nice!nano)
[chip.nrf52840]
# DCDC regulator 0 enabled (default: true)
dcdc_reg0 = true
# DCDC regulator 1 enabled (default: true)
dcdc_reg1 = true
# DCDC regulator 0 voltage: "3V3" or "1V8" (default: "3V3")
dcdc_reg0_voltage = "3V3"
